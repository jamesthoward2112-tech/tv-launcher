name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attaching the APK to a release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      # Signs with the fixed release key from repository secrets, so each release installs
      # over the last. Pull requests from forks get no secrets and fall back to a debug key.
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: tv-launcher-apk
          path: launcher.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher.apk "tv-launcher-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "tv-launcher-${GITHUB_REF_NAME}.apk" --generate-notes
